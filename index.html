<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>(Ad)mission Possible — Impossible becomes possible</title>
    <meta
      name="description"
      content="Your future is more than a college acceptance letter. Guided mentorship, by first-gen students, for the next ones."
    />
    <link rel="canonical" href="https://admission-possible.vercel.app/" />

    <!-- Favicons. Without these the SPA rewrite answered GET /favicon.ico with
         index.html, so browsers fell back to the generic globe. -->
    <link rel="icon" href="/favicon.ico?v=graduation-cap" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=graduation-cap" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=graduation-cap" />
    <meta name="theme-color" content="#FDC5F5" />

    <!-- Open Graph / Twitter. The site grows by students pasting links into
         iMessage, WhatsApp and Discord, and none of those preview bots run JS —
         this static head is all they ever read. Tags are intentionally
         site-level; per-route cards need prerendering (issue #45). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="(Ad)mission Possible" />
    <meta property="og:title" content="(Ad)mission Possible — Impossible becomes possible" />
    <meta
      property="og:description"
      content="Your future is more than a college acceptance letter. Guided mentorship, by first-gen students, for the next ones."
    />
    <meta property="og:url" content="https://admission-possible.vercel.app/" />
    <meta property="og:image" content="https://admission-possible.vercel.app/og-card.png?v=graduation-cap" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Admission Possible graduation cap logo" />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="(Ad)mission Possible — Impossible becomes possible" />
    <meta
      name="twitter:description"
      content="Your future is more than a college acceptance letter. Guided mentorship, by first-gen students, for the next ones."
    />
    <meta name="twitter:image" content="https://admission-possible.vercel.app/og-card.png?v=graduation-cap" />

    <!-- Fonts are self-hosted (see @font-face in src/styles/global.css). The
         Google Fonts stylesheet was render-blocking, a third-party single point
         of failure, and disclosed every visitor's IP to Google. Preload the two
         faces the first screen actually paints with. -->
    <link rel="preload" href="/fonts/geist-mono-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/beausite-medium.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
