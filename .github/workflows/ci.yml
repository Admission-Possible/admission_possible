name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: no step in this workflow writes to the repository.
permissions:
  contents: read

# A newer push to the same ref makes the in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs: a mutable tag like `v7` runs
      # whatever that tag points at today. Dependabot's github-actions ecosystem
      # (see dependabot.yml) keeps these pins current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # Kept in step with package.json `engines` and .nvmrc.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
